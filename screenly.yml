---
syntax: manifest_v1
user_version: '0.0.1'
description: 'Calls out the earthquakes around this screen on a map centred on its own location.'
icon: 'https://raw.githubusercontent.com/Screenly/Earthquake-App/main/icon.png'
author: 'Will Cornforth'
homepage_url: 'https://earthquake.usgs.gov'
categories:
  - Dashboards
ready_signal: true
settings:
  override_coordinates:
    type: string
    default_value: ''
    title: Override Coordinates
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        help_text: |
          Enter a comma-separated pair of coordinates (e.g., 37.8267,-122.4233). If not specified, the app will attempt to use the device's coordinates.
  override_locale:
    type: string
    default_value: en
    title: Override Locale
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        help_text: |
          Override the default locale with a supported language code (e.g., en, fr, de). Defaults to English if not specified.
          You can find the available locales here: https://momentjs.com/
  units:
    type: string
    default_value: miles
    title: Distance units
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        help_text: Units for the distances in the labels.
        options:
          - label: Miles
            value: miles
          - label: Kilometres
            value: km
  display_errors:
    type: string
    default_value: 'false'
    title: Display Errors
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        help_text: Show errors on screen instead of falling back to the last cached data. For debugging only.
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text: Sentry Client Key from Sentry SDK for error capturing.
