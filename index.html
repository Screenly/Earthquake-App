<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earthquakes near this screen - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <div id="stage">
      <div id="map">
        <!--
          A flat (equirectangular) world, y = -latitude. The outlines and the
          plate boundaries are set from src/data/*.txt at start-up, so this
          file stays readable. The two <use> copies repeat the land either
          side of the antimeridian, so a view across the seam is not blank.
        -->
        <svg
          id="world"
          preserveAspectRatio="none"
          xmlns:xlink="http://www.w3.org/1999/xlink"
        >
          <rect x="-540" y="-90" width="1080" height="180" fill="#f3f1ec" />
          <path id="land" />
          <use xlink:href="#land" href="#land" x="360" />
          <use xlink:href="#land" href="#land" x="-360" />
          <path id="plates" />
          <use xlink:href="#plates" href="#plates" x="360" />
          <use xlink:href="#plates" href="#plates" x="-360" />
          <path id="graticule" />
          <path id="reach" />
        </svg>

        <div class="marker you" id="you">
          <div class="halo"></div>
          <div class="dot"></div>
          <div class="tag">You</div>
        </div>
        <div class="marker nearest" id="nearest">
          <div class="halo"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="layer brand">
        <span class="live"></span><b>Earthquakes</b> · past 7 days
      </div>

      <div class="layer panel">
        <div>
          <div class="label">Magnitude</div>
          <div class="mag">
            <span class="n" id="mag">—</span><span class="u">M</span>
          </div>
        </div>
        <div class="spot" id="spot"></div>
        <div class="facts">
          <div>
            <div class="label">Distance</div>
            <div class="v" id="distance">—</div>
          </div>
          <div>
            <div class="label">Direction</div>
            <div class="v" id="direction">—</div>
          </div>
          <div>
            <div class="label">When</div>
            <div class="v" id="when">—</div>
          </div>
        </div>
      </div>

      <div class="layer here">
        <div class="label" id="lede">You are here</div>
        <div class="place" id="where"></div>
        <div class="coord" id="coord"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
