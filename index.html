<!DOCTYPE html>
<meta charset="utf-8">
<title>Earthquakes near this screen</title>
<style>
    :root { --ink: #16181b; --ink-60: rgba(22, 24, 27, .6); --ink-35: rgba(22, 24, 27, .35);
            --paper: #f3f1ec; --signal: #d9451f; }
    * { box-sizing: border-box; }

    /* One unit for the whole design: 1rem is a hundredth of the screen's width,
       or of its height scaled to 16:9, whichever is smaller. Everything below is
       in rem, so the layout fills any signage shape without clipping. */
    html { font-size: min(1vw, 1.7778vh); }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font: 1.15rem system-ui, "DejaVu Sans", sans-serif; }

    #stage { position: absolute; inset: 0; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    #map svg { display: block; width: 100%; height: 100%; }

    #lines { fill: none; stroke: rgba(22, 24, 27, .1); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    #reach { fill: none; stroke: var(--ink); stroke-opacity: .5; stroke-width: 2;
             stroke-dasharray: 3 12; vector-effect: non-scaling-stroke; }

    .marker { position: absolute; z-index: 2; }
    .marker div { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
    .halo { width: 3.33rem; height: 3.33rem; border: .1rem solid var(--ink-35); }
    .you .dot { width: 1.15rem; height: 1.15rem; background: var(--ink);
                box-shadow: 0 0 0 .42rem rgba(243, 241, 236, .9); }
    .nearest .dot { width: 1.35rem; height: 1.35rem; background: var(--signal);
                    box-shadow: 0 0 0 .42rem rgba(243, 241, 236, .9); }
    .nearest .halo { width: 2.3rem; height: 2.3rem; border: .16rem solid var(--signal); }
    .tag { border-radius: 0; left: 2.3rem; top: -.73rem; transform: none; white-space: nowrap;
           font-size: 1.25rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-60); }
    .pin { position: absolute; z-index: 1; width: .75rem; height: .75rem;
           margin: -.375rem 0 0 -.375rem; border-radius: 50%; background: var(--signal); opacity: .5; }

    .label { font-size: 1.05rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-35); }

    /* Same paper, one shade down and blurred, with a hairline so it still reads as a card. */
    .layer { position: absolute; z-index: 4;
             background: rgba(226, 222, 213, .58);
             backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
             border-radius: 1rem;
             box-shadow: inset 0 0 0 .07rem rgba(22, 24, 27, .1); }
    .brand { top: 2.6rem; left: 2.6rem; padding: .8rem 1.5rem; border-radius: 999px;
             display: flex; align-items: center; gap: .9rem; font-size: 1.05rem;
             letter-spacing: .18em; text-transform: uppercase; color: var(--ink-60); white-space: nowrap; }
    .brand b { color: var(--ink); font-weight: 500; }
    .live { width: .73rem; height: .73rem; border-radius: 50%; background: var(--signal); }

    .panel { top: 5.6rem; right: 2.6rem; padding: 1.7rem 2rem; text-align: right;
             display: flex; flex-direction: column; align-items: flex-end; gap: 1.4rem; }
    .mag { display: flex; align-items: baseline; gap: .83rem; line-height: .82; margin-top: .42rem; }
    .mag .n { font-size: 11rem; font-weight: 500; letter-spacing: -.04em; color: var(--signal); }
    .mag .u { font-size: 1.35rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-60); }
    .spot { font-size: 2.6rem; font-weight: 500; max-width: 22ch; line-height: 1.15; }
    .facts { display: grid; grid-template-columns: repeat(3, auto); justify-items: end;
             gap: 0 2.2rem; width: 100%; padding-top: 1.4rem;
             border-top: .1rem solid rgba(22, 24, 27, .14); }
    .facts .v { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 2.9rem;
                font-weight: 500; margin-top: .6rem; letter-spacing: -.02em; white-space: nowrap; }

    .here { bottom: 2.6rem; left: 2.6rem; padding: 1.3rem 1.7rem; }
    .here .place { font-size: 3.1rem; font-weight: 500; line-height: 1.1; margin-top: .5rem; }
    .here .coord { margin-top: .45rem; font-family: ui-monospace, "DejaVu Sans Mono", monospace;
                   font-size: 1.2rem; color: var(--ink-35); }

    /* A screen with no location set: keep the wordmark, drop the map and the
       readout, and say what to do about it. */
    .unlocated #map, .unlocated .panel { display: none; }
    .unlocated .here { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%);
                       text-align: center; background: none; backdrop-filter: none; box-shadow: none; }
</style>

<script>
var given = screenly.metadata.coordinates || [];
var coordinates = [Number(given[0]), Number(given[1])];
var units = screenly.settings.units;
var url = screenly.cors_proxy_url + "/https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson";
var kmPerDegree = 111;
var rad = Math.PI / 180;
var youAcross = 0.5;
var youDown = 0.5;
var narrowestKm = 1500;
var widestKm = 12000;
var compass = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
               "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
var found = [];
var visible = [];
var viewKm = 0;
var west, east, north, south;

var stage = document.getElementById("stage");
var map = document.getElementById("map");
var you = document.getElementById("you");
var nearest = document.getElementById("nearest");
var world = document.getElementById("world");
var lines = document.getElementById("lines");
var reach = document.getElementById("reach");

function say(id, text) {
    document.getElementById(id).textContent = text;
}

function longitudeOf(quake) {
    var lng = quake.geometry.coordinates[0];
    if (lng - coordinates[1] > 180) {
        return lng - 360;
    }
    if (lng - coordinates[1] < -180) {
        return lng + 360;
    }
    return lng;
}

function latitudeOf(quake) {
    return quake.geometry.coordinates[1];
}

function kmAway(quake) {
    var lat1 = coordinates[0] * rad;
    var lat2 = latitudeOf(quake) * rad;
    var dLat = lat2 - lat1;
    var dLng = (longitudeOf(quake) - coordinates[1]) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 12742 * Math.asin(Math.sqrt(h));
}

function heading(quake) {
    var lat1 = coordinates[0] * rad;
    var lat2 = latitudeOf(quake) * rad;
    var dLng = (longitudeOf(quake) - coordinates[1]) * rad;
    var y = Math.sin(dLng) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return compass[Math.round((Math.atan2(y, x) / rad + 360) % 360 / 22.5) % 16];
}

function shape() {
    return map.clientHeight / map.clientWidth;
}

function frame(width) {
    var wide = width / kmPerDegree / Math.cos(coordinates[0] * rad);
    var high = width / kmPerDegree * shape();
    west = coordinates[1] - wide * youAcross;
    east = west + wide;
    north = coordinates[0] + high * youDown;
    south = north - high;
    world.setAttribute("viewBox", west + " " + -north + " " + wide + " " + high);
}

function widthToFitTen(quakes) {
    var needed = 0;
    quakes.slice(0, 10).forEach(quake => {
        var up = Math.abs(latitudeOf(quake) - coordinates[0]);
        var along = Math.abs(longitudeOf(quake) - coordinates[1]);
        needed = Math.max(needed, along / youAcross * kmPerDegree * Math.cos(coordinates[0] * rad));
        needed = Math.max(needed, up / youDown * kmPerDegree / shape());
    });
    return Math.max(narrowestKm, Math.min(needed * 1.8, widestKm));
}

function inView(quake) {
    var lat = latitudeOf(quake);
    var lng = longitudeOf(quake);
    return lat > south && lat < north && lng > west && lng < east;
}

function at(element, lat, lng) {
    element.style.left = (lng - west) / (east - west) * 100 + "%";
    element.style.top = (north - lat) / (north - south) * 100 + "%";
}

function away(quake) {
    var km = kmAway(quake);
    if (units === "km") {
        return Math.round(km) + " km";
    }
    return Math.round(km / 1.609) + " mi";
}

function ago(quake) {
    var minutes = Math.round((Date.now() - quake.properties.time) / 60000);
    if (minutes < 60) {
        return minutes + " min";
    }
    if (minutes < 1440) {
        return Math.round(minutes / 60) + " hr";
    }
    return Math.round(minutes / 1440) + " d";
}

function degrees(value, positive, negative) {
    var mark = positive;
    if (value < 0) {
        mark = negative;
    }
    return Math.abs(value).toFixed(3) + "° " + mark;
}

function grid() {
    var step = 0.2;
    [20, 10, 5, 2, 1, 0.5].forEach(choice => {
        if (choice <= (north - south) / 6) {
            step = Math.max(step, choice);
        }
    });
    var d = "";
    var lng = Math.ceil(west / step) * step;
    while (lng < east) {
        d += "M" + lng + " " + -north + "V" + -south;
        lng = lng + step;
    }
    var lat = Math.ceil(south / step) * step;
    while (lat < north) {
        d += "M" + west + " " + -lat + "H" + east;
        lat = lat + step;
    }
    lines.setAttribute("d", d);
}

function draw() {
    frame(viewKm);
    visible = found.filter(inView);
    if (visible.length === 0) {
        return;
    }
    var quake = visible[0];
    grid();
    at(you, coordinates[0], coordinates[1]);
    at(nearest, latitudeOf(quake), longitudeOf(quake));
    reach.setAttribute("d", "M" + coordinates[1] + " " + -coordinates[0] +
        "L" + longitudeOf(quake) + " " + -latitudeOf(quake));

    document.querySelectorAll(".pin").forEach(pin => pin.remove());
    visible.forEach(other => {
        var pin = document.createElement("div");
        pin.className = "pin";
        at(pin, latitudeOf(other), longitudeOf(other));
        map.appendChild(pin);
    });

    say("mag", quake.properties.mag.toFixed(1));
    say("spot", quake.properties.place);
    say("distance", away(quake));
    say("direction", heading(quake));
    say("when", ago(quake));
}

function load() {
    fetch(url).then(response => response.json()).then(feed => {
        found = feed.features.sort((a, b) => kmAway(a) - kmAway(b));
        viewKm = widthToFitTen(found);
        draw();
    });
}

function positioned() {
    if (!isFinite(coordinates[0]) || !isFinite(coordinates[1])) {
        return false;
    }
    return coordinates[0] !== 0 || coordinates[1] !== 0;
}

if (positioned()) {
    var place = screenly.metadata.location;
    if (!place) {
        place = "This screen";
    }
    say("where", place);
    say("coord", degrees(coordinates[0], "N", "S") + ", " + degrees(coordinates[1], "E", "W"));
    window.addEventListener("resize", draw);
    load();
    setInterval(load, 300000);
} else {
    stage.className = "unlocated";
    say("lede", "This screen");
    say("where", "No location set");
    say("coord", "Add one in Screenly and the map will follow");
}
</script>
